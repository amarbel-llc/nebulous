[[policy]]
id        = "starred-default"
url       = "{{.Story.Permalink}}"
isolation = "fresh"

[[policy.capture]]
name    = "text"
format  = "text"
browser = "firefox"

[[policy.capture]]
name    = "pdf"
format  = "pdf"
browser = "firefox"
split   = true
options = { background = true }

[[policy]]
id  = "screenshot-only"
url = "{{.Story.Permalink}}"

[[policy.capture]]
name    = "screenshot"
format  = "screenshot"
browser = "firefox"
options = { format = "png", "full-page" = true }
